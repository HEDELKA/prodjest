<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>DSH Browser Bridge</title>
</head>
<body>
  <h1>DSH Browser Bridge</h1>
  <div id="status" class="status offline">не подключено</div>

  <label>
    Сервер
    <input id="serverUrl" placeholder="ws://127.0.0.1:8787/ws" spellcheck="false" />
  </label>
  <label>
    Токен
    <input id="token" placeholder="токен из server/token.txt" spellcheck="false" />
  </label>
  <label class="row">
    <input type="checkbox" id="armed" />
    Управление браузером включено
  </label>

  <button id="save">Сохранить и переподключить</button>
  <div id="msg"></div>

  <p class="hint">Сервер слушает только 127.0.0.1. Жёлтая плашка «debugging» на вкладке — норма: это Chrome показывает, что вкладка управляется.</p>
  <script src="popup.js"></script>
</body>
</html>
